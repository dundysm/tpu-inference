# tpu-inference-release-verify: verifies a release's staged image and its
# wheels on one v6e chip each, before the release's publish block. Two
# separate checks, with the same serve flow (serve_and_verify.sh):
#   verify_image   the staged image's own vLLM (verify_image_on_tpu.sh)
#   verify_wheels  the wheels, installed into a fresh venv
#                  (verify_wheels_on_tpu.sh, serve_wheels.sh)
#
# Runs on the TPU CI cluster, which has the TPU fleet but none of the release's
# credentials. The release build (plan_verify.py) triggers it on the release
# commit and waits for it, passing only two image references, each pinned by
# digest:
#   RELEASE_IMAGE_REF        the staged image
#   WHEEL_CARRIER_IMAGE_REF  python:3.12-slim carrying the built wheels as
#                            files (build_wheel_carrier_image.sh)
# A check whose reference is not set is left out, so a build started by hand
# can run one of them.
#
# The pipeline's settings upload this file:
#   buildkite-agent pipeline upload .buildkite/release/verify_pipeline.yml

x-tpu-step: &tpu-step
  agents:
    queue: kube
  # Sized like CI's kube steps (pipeline_jax_kube.yml): it covers queueing for
  # a chip as well as the model download, compile and bench. Not soft_fail:
  # a failed check has to stop the release.
  timeout_in_minutes: 1440
  env:
    SHAPE: "ct6e-standard-1t/1x1"
  plugins:
    - kubernetes:
        podTemplate: tpu-launcher

steps:
  - label: ":kubernetes: Verify the staged image on TPU"
    key: verify_image
    if: build.env("RELEASE_IMAGE_REF") != null
    <<: *tpu-step
    commands:
      - bash .buildkite/release/verify_image_on_tpu.sh

  - label: ":package: Verify the wheels on TPU"
    key: verify_wheels
    if: build.env("WHEEL_CARRIER_IMAGE_REF") != null
    <<: *tpu-step
    commands:
      - bash .buildkite/release/verify_wheels_on_tpu.sh
